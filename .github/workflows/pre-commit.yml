# Secrets and variables required:
# - variables:
#   - ENABLE_ORG_CICD_PRE_COMMIT
#   - ENABLE_REPO_CICD_PRE_COMMIT

name: pre-commit

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Action Deshabilitada por configuración
        if: ${{ vars.ENABLE_ORG_CICD_PRE_COMMIT != 1 || vars.ENABLE_REPO_CICD_PRE_COMMIT != 1 }}
        run: |
          echo "⚠️ Las configuraciones de activación no están habilitadas:"

          echo "ENABLE_ORG_CICD_PRE_COMMIT=${{ vars.ENABLE_ORG_CICD_PRE_COMMIT }}"

          echo "ENABLE_REPO_CICD_PRE_COMMIT=${{ vars.ENABLE_REPO_CICD_PRE_COMMIT }}"

          echo "Saliendo sin ejecutar tests."
          exit 0


      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get python version
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Check that all files generated by pre-commit are in git
        run: |
          newfiles="$(git ls-files --others --exclude-from=.gitignore)"
          if [ "$newfiles" != "" ] ; then
              echo "Please check-in the following files:"
              echo "$newfiles"
              exit 1
          fi