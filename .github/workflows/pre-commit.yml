name: pre-commit

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get python version
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Collect modified Odoo module files
        if: github.event_name == 'pull_request'
        id: odoo-module-files
        run: |
          chmod +x .github/workflows/scripts/get_modified_odoo_modules.sh
          files="$(.github/workflows/scripts/get_modified_odoo_modules.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "Modified Odoo module files detected: $files"
            echo "has_modified_odoo_module_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Odoo module files modified in this PR."
            echo "has_modified_odoo_module_files=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pre-commit
        if: steps.odoo-module-files.outputs.has_modified_odoo_module_files == 'true'
        run: |
          files="${{ steps.odoo-module-files.outputs.files }}"
          if [ -n "$files" ]; then
            pre-commit run --files $files --show-diff-on-failure --color=always
          else
            echo "Skipping pre-commit: no modified files under Odoo modules."
          fi
      - name: Check that all files generated by pre-commit are in git
        run: |
          newfiles="$(git ls-files --others --exclude-from=.gitignore)"
          if [ "$newfiles" != "" ] ; then
              echo "Please check-in the following files:"
              echo "$newfiles"
              exit 1
          fi
