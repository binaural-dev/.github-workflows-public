# .github/workflows/upload-github-action-files.yml

# Secrets and variables required:
# - secrets:
#   - ORG_CICD_TOKEN
# - variables:

name: Upload GitHub Action Files by Lot

on:
  workflow_dispatch:
    inputs:
      json-settings:
        description: 'Configuración en formato JSON'
        required: true
        type: string

jobs:
  run-cli-command:
    if: github.actor == 'binauralbot'
    runs-on: ubuntu-latest
    steps:
      - name: Install and run BINCLI to upload GitHub Action files by lot
        uses: binaural-dev/.github-workflows-public/.github/actions/install_bincli@release
        env:
          ORG_CICD_TOKEN: ${{ secrets.ORG_CICD_TOKEN }}
          S3_ACCESS_KEY: ${{ secrets.ORG_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.ORG_S3_SECRET_KEY }}
          S3_BUCKET_NAME: ${{ secrets.ORG_S3_BUCKET_NAME }}
          S3_ENDPOINT_URL: ${{ secrets.ORG_S3_ENDPOINT_URL }}
          S3_REGION_NAME: ${{ secrets.ORG_S3_REGION_NAME }}
        with:
          BINCLI_BRANCH_OR_TAG: 'release'
          CICD_TOKEN: ${{ secrets.ORG_CICD_TOKEN }}
          cli-command: |
            chcli devops github-action upload-github-action-files-by-lot \
              -j '${{ toJson(inputs.json-settings) }}'