name: Manual Dummy Commit

on:
  workflow_dispatch:

jobs:
  update-dummy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Overwrite .dummy with current timestamp
        run: |
          echo "$(date -u)" > .dummy

      - name: Commit changes
        run: |
          git add .dummy
          git commit -m "Overwrite .dummy with current UTC timestamp" || echo "No changes to commit"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD
